version: "3.8"

services:
  traefik:
    image: "traefik:v2.9"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      # - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
    ports:
      - "80:80" 
      - "8080:8080" 
    networks:
      - mon_reseau_tp
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro" 
    deploy:
      placement:
        constraints:
          - node.role == manager

  # Service MySQL
  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: motdepasse
      MYSQL_DATABASE: ma_base_de_donnees
    networks:
      - mon_reseau_tp
    volumes:
      - db_data_tp:/var/lib/mysql
    deploy:
      placement:
        constraints:
          - node.hostname == o22203701-75

  # Service Web (PHP + Apache)
  reprise_contact:
    image: reprise_contact
    build: ./reprise_contact/.
    networks:
      - mon_reseau_tp
    depends_on:
      - db
      - redis
      - traefik
    volumes:
      - /home/o22203701/TP_Note/reprise_contact:/var/www/html
    deploy:
      placement:
        constraints:
          - node.hostname == o22203701-218
    labels:
      - "traefik.enable=true" 
      - "traefik.http.routers.web_apache.rule=Host(`utilisateurs.o22203701-75`)" 
      - "traefik.http.routers.web_apache.entrypoints=web"
      - "traefik.http.services.web_apache.loadbalancer.server.port=80"

  # Service Redis
  redis:
    image: redis:latest
    networks:
      - mon_reseau_tp
    ports:
      - "6379:6379"
    deploy:
      placement:
        constraints:
          - node.hostname == o22203701-89

# Définition du réseau Swarm
networks:
  mon_reseau_tp:
    driver: overlay

# Définition des volumes
volumes:
  db_data_tp: